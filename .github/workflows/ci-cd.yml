# End-to-end CI/CD pipeline for the CIA2 Task Manager.
#
#  push to main ──► 1. Secret scan (Gitleaks)
#                   2. Build & test (Maven) + code quality (SonarQube + quality gate)
#                   3. Docker build, tag & push to Azure Container Registry
#                   4. Deploy to Azure Kubernetes Service with Ansible + verify
#
# Pull requests run stages 1-2 only (nothing is deployed).
#
# Repository secrets needed (Settings > Secrets and variables > Actions > Secrets):
#   SONAR_TOKEN        token from SonarQube Cloud (My Account > Security)
#   ACR_USERNAME       ACR admin user name
#   ACR_PASSWORD       ACR admin password
#   KUBE_CONFIG        contents of the AKS kubeconfig file
# Repository variables needed (same page > Variables):
#   ACR_LOGIN_SERVER   e.g. cia2taskmanager.azurecr.io (not secret; a variable so the
#                      image name can be passed between jobs)
#   SONAR_ORGANIZATION SonarQube Cloud organization key
#   SONAR_PROJECT_KEY  SonarQube Cloud project key
#   SONAR_HOST_URL     optional, defaults to https://sonarcloud.io

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: taskmanager
  GITLEAKS_VERSION: 8.30.1

jobs:
  # ---------------------------------------------------------------------------
  secret-scan:
    name: 1. Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # --proto '=https' refuses any redirect to plain HTTP (SonarQube rule S6506)
          curl --proto '=https' --tlsv1.2 -sSfLO "$base/$file"
          curl --proto '=https' --tlsv1.2 -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan the whole Git history for secrets
        run: |
          gitleaks git . --config .gitleaks.toml --redact --verbose \
            --report-format json --report-path gitleaks-report.json

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  build-test:
    name: 2. Build, test & code quality (Maven + SonarQube)
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # SonarQube uses Git history for "new code" detection

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile, run unit tests and package (mvn verify)
        run: mvn -B verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: taskmanager-jar
          path: target/taskmanager.jar

      - name: SonarQube analysis and quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'cia2-taskmanager' }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN secret is not set - see docs/SETUP.md (step 5)"
            exit 1
          fi
          # -Dsonar.qualitygate.wait=true makes this step FAIL if the quality gate fails
          mvn -B sonar:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

  # ---------------------------------------------------------------------------
  docker:
    name: 3. Docker build, tag & push (ACR)
    needs: build-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only the short commit SHA is passed on. The full image name contains the
    # registry name, which equals the ACR_USERNAME secret, and GitHub silently
    # drops any job output that contains a secret value.
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Work out image name and tag
        id: meta
        env:
          REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          version="${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY/$IMAGE_NAME:$version" >> "$GITHUB_OUTPUT"
          echo "Image: $REGISTRY/$IMAGE_NAME:$version"

      - name: Build and tag the Docker image
        env:
          REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker build \
            --build-arg APP_VERSION="$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$REGISTRY/$IMAGE_NAME:$VERSION" \
            -t "$REGISTRY/$IMAGE_NAME:latest" .
          docker images "$REGISTRY/$IMAGE_NAME"

      - name: Log in to Azure Container Registry
        # Third-party action pinned to a full commit SHA so a moved tag cannot change it (S7637)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push the image to the registry
        env:
          REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
        run: docker push --all-tags "$REGISTRY/$IMAGE_NAME"

  # ---------------------------------------------------------------------------
  deploy:
    name: 4. Deploy to AKS (Ansible) & verify
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Connect kubectl to the AKS cluster
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s\n' "$KUBE_CONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Set up Python for Ansible
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Ansible and the Kubernetes client
        run: |
          # Wheels only (no setup scripts run) and every package hash-locked (S8541, S8544)
          pip install --quiet --only-binary :all: --require-hashes -r ansible/requirements.txt
          ansible --version | head -1
          ansible-galaxy collection list kubernetes.core

      - name: Deploy or update the application (Ansible playbook)
        env:
          IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.version }}
          APP_VERSION: ${{ needs.docker.outputs.version }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ANSIBLE_FORCE_COLOR: '1'
        run: ansible-playbook -i ansible/inventory.ini ansible/deploy.yml

      - name: Verify deployment status and availability
        run: |
          kubectl rollout status deployment/taskmanager -n taskmanager --timeout=120s
          kubectl get deployment,pods,service -n taskmanager -o wide
          ip=$(kubectl get service taskmanager -n taskmanager -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Health check:"; curl -sSf "http://$ip/actuator/health"; echo
          echo "Version info:"; curl -sSf "http://$ip/api/info"; echo
          {
            echo "### Deployed :rocket:"
            echo "Application URL: http://cia2-taskmanager.centralindia.cloudapp.azure.com (IP: http://$ip)"
            echo "Image: \`${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

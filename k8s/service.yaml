apiVersion: v1
kind: Service
metadata:
  name: taskmanager
  namespace: taskmanager
  labels:
    app: taskmanager
  annotations:
    # Gives the public IP a DNS name:
    #   http://cia2-taskmanager.centralindia.cloudapp.azure.com
    # Some networks (e.g. the college Wi-Fi web filter) block bare-IP URLs.
    service.beta.kubernetes.io/azure-dns-label-name: cia2-taskmanager
spec:
  # On AKS this creates an Azure Load Balancer with a public IP
  type: LoadBalancer
  # Tasks are kept in memory inside each pod, so keep every user on the same
  # pod; otherwise a task added on pod 1 is "not found" when the next request
  # (complete/delete) lands on pod 2. Timeout: 3 hours of inactivity.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  selector:
    app: taskmanager
  ports:
    - name: http
      port: 80
      targetPort: http

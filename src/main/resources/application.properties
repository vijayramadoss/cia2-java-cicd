spring.application.name=taskmanager
server.port=8080

# Shown on the web page. APP_VERSION is set by the Docker build (Git commit SHA).
app.name=CIA2 Task Manager
app.version=${APP_VERSION:local-dev}
# Change this line and push to see the pipeline redeploy the app automatically.
app.message=Version 1 - deployed by the CI/CD pipeline

# Health endpoints used by Kubernetes liveness/readiness probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Do not leak internal details in error responses
server.error.include-stacktrace=never
server.error.include-message=never
